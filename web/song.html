<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nummer · BluesLab</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="speler.js?v=3" defer></script>
  <script src="app.js?v=7" defer></script>
</head>
<body data-pagina="song">
  <header class="balk">
    <div class="balk-rij">
      <a id="terug" href="javascript:history.back()">← Setlist</a>
      <span id="balk-titel"></span>
      <a id="vorige" class="navknop" aria-label="Vorig nummer" hidden>◀</a>
      <a id="volgende" class="navknop" aria-label="Volgend nummer" hidden>▶</a>
    </div>
    <div id="instrument"></div>
    <div id="speler" class="spelerbalk" hidden></div>
    <nav id="sprong" class="sprong" aria-label="Naar deel"></nav>
  </header>
  <main>
    <p id="fout" class="foutvak" hidden></p>
    <header id="kop"></header>
    <div id="fragment" class="fragment"></div>
    <p id="hulp" class="klein" hidden>Tik op een maat om daar te beginnen. Hoor je niets? Zet het geluid aan. Piano: Salamander Grand Piano (Alexander Holm, CC-BY 3.0).</p>
    <div id="schema"></div>
    <p><a id="naar-controle" href="#">Bewerken</a></p>
  </main>
</body>
</html>
